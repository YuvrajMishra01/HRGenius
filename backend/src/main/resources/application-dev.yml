# Development profile: H2 in-memory in Oracle compatibility mode.
# Same Flyway scripts run here as on real Oracle. Zero installation required.
spring:
  datasource:
    url: jdbc:h2:mem:hrgenius;MODE=Oracle;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.SQL: debug
