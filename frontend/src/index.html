<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HRGenius — HR Management System</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HRGenius — modern HR management for modern teams. Employees, recruitment, attendance, leave, payroll and performance in one workspace.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    // Apply the persisted theme before first paint to avoid a light/dark flash.
    try {
      if (localStorage.getItem('hrgenius.theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    } catch { /* storage unavailable — stay light */ }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
