<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="shell-sidenav">
    <div class="brand">
      <mat-icon>workspace_premium</mat-icon>
      <span>HRGenius</span>
    </div>
    <mat-nav-list>
      @for (item of visibleNavItems; track item.route) {
        <a mat-list-item [routerLink]="item.route" routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
    <div class="sidebar-footer">v0.2 · Phase 17 — Complete</div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="shell-toolbar">
      <span>Human Resource Management System</span>
      <span class="spacer"></span>

      @if (auth.user(); as user) {
        <a mat-icon-button routerLink="/notifications" class="bell"
           [matTooltip]="unreadCount() > 0 ? unreadCount() + ' unread notification(s)' : 'Notifications'">
          <mat-icon [matBadge]="unreadCount() || null" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
        </a>
        <button
          mat-button
          class="user-chip"
          [matMenuTriggerFor]="accountMenu"
          [matTooltip]="user.email"
        >
          <mat-icon>account_circle</mat-icon>
          <span class="user-name">{{ user.fullName }}</span>
          <span class="user-role">{{ user.role }}</span>
          <mat-icon iconPositionEnd>arrow_drop_down</mat-icon>
        </button>

        <mat-menu #accountMenu="matMenu">
          <button mat-menu-item (click)="auth.logout()">
            <mat-icon>logout</mat-icon>
            <span>Sign out</span>
          </button>
        </mat-menu>
      }
    </mat-toolbar>

    <main class="content">
      <router-outlet></router-outlet>
      <div class="route-anim-wrapper"></div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
